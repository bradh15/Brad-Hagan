<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brad Hagan | Home</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f8f9fa; color: #333; line-height: 1.6; }
        header { background-color: #1a1a1a; color: #fff; padding: 1rem 2rem; position: fixed; width: 100%; top: 0; z-index: 1000; }
        nav { display: flex; justify-content: space-between; align-items: center; max-width: 1100px; margin: 0 auto; }
        nav ul { display: flex; list-style: none; }
        nav ul li { margin-left: 1.5rem; }
        nav a { color: #fff; text-decoration: none; transition: color 0.3s; font-weight: 500; }
        nav a:hover, nav a.active { color: #f1be48; }
        
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 1rem;
            background: linear-gradient(135deg, #1a1a1a 0%, #c8102e 100%);
            color: white;
        }
        .hero h1 { font-size: 3.5rem; margin-bottom: 0.5rem; }
        .hero p { font-size: 1.25rem; margin-bottom: 2rem; max-width: 600px; }
        .btn-group { display: flex; gap: 1rem; }
        .btn {
            display: inline-block;
            background-color: #f1be48;
            color: #1a1a1a;
            padding: 0.75rem 1.5rem;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.3s, color 0.3s;
        }
        .btn:hover { background-color: #fff; color: #1a1a1a; }
        .btn-secondary { background-color: transparent; border: 2px solid #fff; color: #fff; }
        .btn-secondary:hover { background-color: #fff; color: #1a1a1a; }

        footer { text-align: center; padding: 2rem; background-color: #1a1a1a; color: #fff; margin-top: 0; }
    </style>
</head>
<body>

    <header>
        <nav>
            <div class="logo"><a href="index.html" style="color:#fff; text-decoration:none; font-size:1.2rem;"><strong>Brad Hagan</strong></a></div>
            <ul>
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <div class="hero">
        <h1>Hi, I'm Brad Hagan</h1>
        <p>Iowa State University Student | Sports Enthusiast | EDM Fanatic</p>
        <div class="btn-group">
            <a href="about.html" class="btn">About Me</a>
            <a href="projects.html" class="btn btn-secondary">My Work</a>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Brad Hagan. Built with HTML & CSS.</p>
    </footer>

</body>
</html>
